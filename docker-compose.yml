services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_coordination
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_coordination"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agent_coordination_pg:/var/lib/postgresql/data

volumes:
  agent_coordination_pg:
